<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Incidents Fetching</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      color: #60a5fa;
      margin-bottom: 30px;
    }
    .section {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section h2 {
      color: #93c5fd;
      margin-top: 0;
      margin-bottom: 15px;
    }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    button:hover {
      background: #2563eb;
    }
    pre {
      background: #0f172a;
      padding: 15px;
      border: 1px solid #334155;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.5;
    }
    .error {
      color: #ef4444;
      background: #7f1d1d;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .success {
      color: #10b981;
      background: #064e3b;
      padding: 10px;
      border-radius: 6px;
      margin-top: 10px;
    }
    .info {
      color: #60a5fa;
      font-size: 14px;
      margin-bottom: 15px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }
    .stat-card {
      background: #0f172a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
    }
    .stat-label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      color: #e2e8f0;
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }
    .provider-card {
      background: #0f172a;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #334155;
      margin-bottom: 10px;
    }
    .provider-name {
      color: #e2e8f0;
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .incident-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      margin-right: 5px;
    }
    .badge-critical { background: #7f1d1d; color: #fca5a5; }
    .badge-major { background: #78350f; color: #fdba74; }
    .badge-minor { background: #1e3a8a; color: #93c5fd; }
  </style>
</head>
<body>
  <h1>🔍 AI Platform Status Monitor - Data Diagnostics</h1>

  <div class="section">
    <h2>Quick Tests</h2>
    <button onclick="testProviders()">Test Providers</button>
    <button onclick="testIncidents()">Test Active Incidents</button>
    <button onclick="testOpenAIIncidents()">Test OpenAI Incidents</button>
    <button onclick="testAllProviderIncidents()">Test All Provider Incidents</button>
    <button onclick="clearOutput()">Clear Output</button>
  </div>

  <div id="output"></div>

  <script>
    const SUPABASE_URL = 'https://xwcyycgpqkyyacudbcxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3Y3l5Y2dwcWt5eWFjdWRiY3h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg2NjUxMjAsImV4cCI6MjA0NDI0MTEyMH0.dKkvTkBcaqdBGlBCvDN9nsPHdIKxiNmkXcdxxf1DsMg';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function clearOutput() {
      document.getElementById('output').innerHTML = '';
    }

    function showLoading(message = 'Loading...') {
      document.getElementById('output').innerHTML = `<div class="info">⏳ ${message}</div>`;
    }

    async function testProviders() {
      showLoading('Fetching providers...');
      try {
        const { data, error } = await supabaseClient
          .from('providers')
          .select('*')
          .eq('is_active', true)
          .order('name');

        if (error) throw error;

        const stats = {
          total: data.length,
          active: data.filter(p => p.is_active).length
        };

        const output = `
          <div class="section">
            <h2>✓ Providers Test</h2>
            <div class="success">Successfully fetched ${data.length} providers</div>
            <div class="stats">
              <div class="stat-card">
                <div class="stat-label">Total Providers</div>
                <div class="stat-value">${stats.total}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Active Providers</div>
                <div class="stat-value">${stats.active}</div>
              </div>
            </div>
            <h3 style="margin-top: 20px;">Providers List:</h3>
            ${data.map(p => `
              <div class="provider-card">
                <div class="provider-name">${p.name}</div>
                <div style="font-size: 12px; color: #94a3b8;">
                  Slug: ${p.slug} | Last checked: ${p.last_checked ? new Date(p.last_checked).toLocaleString() : 'Never'}
                </div>
              </div>
            `).join('')}
            <details style="margin-top: 15px;">
              <summary style="cursor: pointer; color: #60a5fa;">Show Raw JSON</summary>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </details>
          </div>
        `;
        document.getElementById('output').innerHTML = output;
      } catch (error) {
        document.getElementById('output').innerHTML = `
          <div class="section">
            <h2>✗ Providers Test Failed</h2>
            <div class="error">Error: ${error.message}</div>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          </div>
        `;
      }
    }

    async function testIncidents() {
      showLoading('Fetching active incidents...');
      try {
        const { data, error } = await supabaseClient
          .from('incidents')
          .select(`
            *,
            provider:providers(*)
          `)
          .is('resolved_at', null)
          .order('started_at', { ascending: false });

        if (error) throw error;

        const stats = {
          total: data.length,
          critical: data.filter(i => i.severity === 'critical').length,
          major: data.filter(i => i.severity === 'major').length,
          minor: data.filter(i => i.severity === 'minor').length
        };

        const output = `
          <div class="section">
            <h2>✓ Active Incidents Test</h2>
            <div class="success">Successfully fetched ${data.length} active incidents</div>
            <div class="stats">
              <div class="stat-card">
                <div class="stat-label">Total Active</div>
                <div class="stat-value">${stats.total}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Critical</div>
                <div class="stat-value" style="color: #ef4444;">${stats.critical}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Major</div>
                <div class="stat-value" style="color: #f59e0b;">${stats.major}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Minor</div>
                <div class="stat-value" style="color: #3b82f6;">${stats.minor}</div>
              </div>
            </div>
            <h3 style="margin-top: 20px;">Incidents List:</h3>
            ${data.map(i => `
              <div class="provider-card">
                <div style="margin-bottom: 10px;">
                  <span class="incident-badge badge-${i.severity}">${i.severity}</span>
                  <span style="color: #94a3b8; font-size: 12px;">Status: ${i.status}</span>
                </div>
                <div class="provider-name">${i.provider?.name || 'Unknown Provider'}</div>
                <div style="color: #e2e8f0; margin: 8px 0;">${i.title}</div>
                <div style="font-size: 12px; color: #94a3b8;">
                  Started: ${new Date(i.started_at).toLocaleString()}
                  ${i.component ? ` | Component: ${i.component}` : ''}
                </div>
              </div>
            `).join('')}
            <details style="margin-top: 15px;">
              <summary style="cursor: pointer; color: #60a5fa;">Show Raw JSON</summary>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </details>
          </div>
        `;
        document.getElementById('output').innerHTML = output;
      } catch (error) {
        document.getElementById('output').innerHTML = `
          <div class="section">
            <h2>✗ Active Incidents Test Failed</h2>
            <div class="error">Error: ${error.message}</div>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          </div>
        `;
      }
    }

    async function testOpenAIIncidents() {
      showLoading('Fetching OpenAI incidents...');
      try {
        const { data: provider, error: providerError } = await supabaseClient
          .from('providers')
          .select('*')
          .eq('slug', 'openai')
          .maybeSingle();

        if (providerError) throw providerError;
        if (!provider) {
          throw new Error('OpenAI provider not found');
        }

        const { data: incidents, error: incidentsError } = await supabaseClient
          .from('incidents')
          .select('*')
          .eq('provider_id', provider.id)
          .order('started_at', { ascending: false });

        if (incidentsError) throw incidentsError;

        const activeIncidents = incidents.filter(i => !i.resolved_at);
        const resolvedIncidents = incidents.filter(i => i.resolved_at);

        const output = `
          <div class="section">
            <h2>✓ OpenAI Incidents Test</h2>
            <div class="success">Successfully fetched incidents for OpenAI</div>
            <div class="stats">
              <div class="stat-card">
                <div class="stat-label">Total Incidents</div>
                <div class="stat-value">${incidents.length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Active</div>
                <div class="stat-value" style="color: #f59e0b;">${activeIncidents.length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Resolved</div>
                <div class="stat-value" style="color: #10b981;">${resolvedIncidents.length}</div>
              </div>
            </div>
            <h3 style="margin-top: 20px; color: #f59e0b;">Active Incidents (${activeIncidents.length}):</h3>
            ${activeIncidents.length > 0 ? activeIncidents.map(i => `
              <div class="provider-card">
                <div style="margin-bottom: 10px;">
                  <span class="incident-badge badge-${i.severity}">${i.severity}</span>
                  <span style="color: #94a3b8; font-size: 12px;">Status: ${i.status}</span>
                </div>
                <div style="color: #e2e8f0; margin: 8px 0; font-weight: bold;">${i.title}</div>
                ${i.description ? `<div style="color: #94a3b8; font-size: 13px; margin: 8px 0;">${i.description}</div>` : ''}
                <div style="font-size: 12px; color: #94a3b8;">
                  Started: ${new Date(i.started_at).toLocaleString()}
                  ${i.component ? ` | Component: ${i.component}` : ''}
                </div>
              </div>
            `).join('') : '<div class="info">No active incidents</div>'}

            ${resolvedIncidents.length > 0 ? `
              <h3 style="margin-top: 20px; color: #10b981;">Resolved Incidents (${resolvedIncidents.length}):</h3>
              ${resolvedIncidents.slice(0, 3).map(i => `
                <div class="provider-card" style="opacity: 0.6;">
                  <div style="margin-bottom: 10px;">
                    <span class="incident-badge badge-${i.severity}">${i.severity}</span>
                    <span style="color: #10b981; font-size: 12px;">✓ Resolved</span>
                  </div>
                  <div style="color: #e2e8f0; margin: 8px 0;">${i.title}</div>
                  <div style="font-size: 12px; color: #94a3b8;">
                    ${new Date(i.started_at).toLocaleString()} - ${new Date(i.resolved_at).toLocaleString()}
                  </div>
                </div>
              `).join('')}
            ` : ''}
            <details style="margin-top: 15px;">
              <summary style="cursor: pointer; color: #60a5fa;">Show Raw JSON</summary>
              <pre>${JSON.stringify({ provider, incidents }, null, 2)}</pre>
            </details>
          </div>
        `;
        document.getElementById('output').innerHTML = output;
      } catch (error) {
        document.getElementById('output').innerHTML = `
          <div class="section">
            <h2>✗ OpenAI Incidents Test Failed</h2>
            <div class="error">Error: ${error.message}</div>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          </div>
        `;
      }
    }

    async function testAllProviderIncidents() {
      showLoading('Fetching all providers with their incidents...');
      try {
        const { data: providers, error: providersError } = await supabaseClient
          .from('providers')
          .select('*')
          .eq('is_active', true)
          .order('name');

        if (providersError) throw providersError;

        const providersWithIncidents = await Promise.all(
          providers.map(async (provider) => {
            const { data: incidents } = await supabaseClient
              .from('incidents')
              .select('*')
              .eq('provider_id', provider.id)
              .is('resolved_at', null);

            return {
              ...provider,
              activeIncidents: incidents || [],
              activeCount: incidents?.length || 0
            };
          })
        );

        const withIssues = providersWithIncidents.filter(p => p.activeCount > 0);
        const operational = providersWithIncidents.filter(p => p.activeCount === 0);

        const output = `
          <div class="section">
            <h2>✓ All Providers with Incidents</h2>
            <div class="success">Successfully analyzed ${providers.length} providers</div>
            <div class="stats">
              <div class="stat-card">
                <div class="stat-label">Operational</div>
                <div class="stat-value" style="color: #10b981;">${operational.length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">With Issues</div>
                <div class="stat-value" style="color: #f59e0b;">${withIssues.length}</div>
              </div>
              <div class="stat-card">
                <div class="stat-label">Total Incidents</div>
                <div class="stat-value">${withIssues.reduce((sum, p) => sum + p.activeCount, 0)}</div>
              </div>
            </div>

            ${withIssues.length > 0 ? `
              <h3 style="margin-top: 20px; color: #f59e0b;">⚠️ Providers with Issues (${withIssues.length}):</h3>
              ${withIssues.map(p => `
                <div class="provider-card">
                  <div class="provider-name">
                    ${p.name}
                    <span style="background: #7f1d1d; color: #fca5a5; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 10px;">
                      ${p.activeCount} active incident${p.activeCount > 1 ? 's' : ''}
                    </span>
                  </div>
                  ${p.activeIncidents.map(i => `
                    <div style="margin: 10px 0; padding: 10px; background: #0f172a; border-radius: 4px;">
                      <span class="incident-badge badge-${i.severity}">${i.severity}</span>
                      <span style="color: #e2e8f0; margin-left: 8px;">${i.title}</span>
                    </div>
                  `).join('')}
                </div>
              `).join('')}
            ` : ''}

            <h3 style="margin-top: 20px; color: #10b981;">✓ Operational Providers (${operational.length}):</h3>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;">
              ${operational.map(p => `
                <div class="provider-card" style="background: #064e3b; border-color: #065f46;">
                  <div style="color: #10b981; font-weight: bold;">${p.name}</div>
                </div>
              `).join('')}
            </div>

            <details style="margin-top: 15px;">
              <summary style="cursor: pointer; color: #60a5fa;">Show Raw JSON</summary>
              <pre>${JSON.stringify(providersWithIncidents, null, 2)}</pre>
            </details>
          </div>
        `;
        document.getElementById('output').innerHTML = output;
      } catch (error) {
        document.getElementById('output').innerHTML = `
          <div class="section">
            <h2>✗ Provider Incidents Test Failed</h2>
            <div class="error">Error: ${error.message}</div>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          </div>
        `;
      }
    }

    // Auto-run test on page load
    window.addEventListener('load', () => {
      testAllProviderIncidents();
    });
  </script>
</body>
</html>
