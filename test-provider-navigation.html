<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Provider Navigation Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      color: #60a5fa;
    }
    .info {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }
    .provider-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .provider-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .provider-card:hover {
      background: #334155;
      border-color: #60a5fa;
    }
    .provider-name {
      font-weight: bold;
      color: #e2e8f0;
      margin-bottom: 5px;
    }
    .provider-slug {
      font-size: 12px;
      color: #94a3b8;
    }
    .test-result {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }
    pre {
      background: #000;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>🧪 Provider Navigation Test</h1>

  <div class="info">
    <h3>Test Instructions:</h3>
    <ol>
      <li>Click on any provider card below</li>
      <li>The test will fetch the provider details</li>
      <li>Results will be displayed below</li>
    </ol>
  </div>

  <div id="providers-container">
    <p>Loading providers...</p>
  </div>

  <div id="results"></div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://xwcyycgpqkyyacudbcxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3Y3l5Y2dwcWt5eWFjdWRiY3h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg2NjUxMjAsImV4cCI6MjA0NDI0MTEyMH0.dKkvTkBcaqdBGlBCvDN9nsPHdIKxiNmkXcdxxf1DsMg';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadProviders() {
      const container = document.getElementById('providers-container');

      try {
        const { data: providers, error } = await supabase
          .from('providers')
          .select('*')
          .eq('is_active', true)
          .order('name');

        if (error) throw error;

        container.innerHTML = `
          <h3>Click a provider to test navigation:</h3>
          <div class="provider-list">
            ${providers.map(p => `
              <div class="provider-card" onclick="testProviderDetail('${p.slug}')">
                <div class="provider-name">${p.name}</div>
                <div class="provider-slug">slug: ${p.slug}</div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (error) {
        container.innerHTML = `<p style="color: #ef4444;">Error loading providers: ${error.message}</p>`;
      }
    }

    window.testProviderDetail = async function(slug) {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = `
        <div class="test-result">
          <h3>🔄 Testing provider: ${slug}</h3>
          <p>Loading data...</p>
        </div>
      `;

      try {
        // Step 1: Fetch provider
        const { data: provider, error: providerError } = await supabase
          .from('providers')
          .select('*')
          .eq('slug', slug)
          .maybeSingle();

        if (providerError) throw providerError;
        if (!provider) {
          resultsDiv.innerHTML = `
            <div class="test-result">
              <h3>❌ Provider not found</h3>
              <p>No provider found with slug: ${slug}</p>
            </div>
          `;
          return;
        }

        // Step 2: Fetch incidents
        const { data: incidents, error: incidentsError } = await supabase
          .from('incidents')
          .select('*')
          .eq('provider_id', provider.id)
          .order('started_at', { ascending: false })
          .limit(20);

        if (incidentsError) throw incidentsError;

        // Step 3: Fetch latest check
        const { data: latestCheck, error: checkError } = await supabase
          .from('status_checks')
          .select('*')
          .eq('provider_id', provider.id)
          .order('checked_at', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (checkError) throw checkError;

        const activeIncidents = incidents?.filter(i => !i.resolved_at) || [];
        const resolvedIncidents = incidents?.filter(i => i.resolved_at) || [];

        resultsDiv.innerHTML = `
          <div class="test-result">
            <h3>✅ Success! Provider Data Loaded</h3>

            <h4 style="color: #60a5fa; margin-top: 20px;">Provider Info:</h4>
            <ul>
              <li><strong>Name:</strong> ${provider.name}</li>
              <li><strong>Slug:</strong> ${provider.slug}</li>
              <li><strong>Status URL:</strong> ${provider.status_url || 'N/A'}</li>
              <li><strong>Last Checked:</strong> ${provider.last_checked ? new Date(provider.last_checked).toLocaleString() : 'Never'}</li>
            </ul>

            <h4 style="color: #60a5fa; margin-top: 20px;">Incidents:</h4>
            <ul>
              <li><strong>Total Incidents:</strong> ${incidents?.length || 0}</li>
              <li><strong>Active Incidents:</strong> ${activeIncidents.length}</li>
              <li><strong>Resolved Incidents:</strong> ${resolvedIncidents.length}</li>
            </ul>

            ${activeIncidents.length > 0 ? `
              <h4 style="color: #f59e0b; margin-top: 20px;">⚠️ Active Incidents:</h4>
              ${activeIncidents.map(i => `
                <div style="background: #7f1d1d; padding: 10px; margin: 10px 0; border-radius: 4px;">
                  <strong>${i.title}</strong><br>
                  <span style="color: #94a3b8; font-size: 12px;">
                    Severity: ${i.severity} | Status: ${i.status}<br>
                    Started: ${new Date(i.started_at).toLocaleString()}
                  </span>
                </div>
              `).join('')}
            ` : ''}

            ${latestCheck ? `
              <h4 style="color: #60a5fa; margin-top: 20px;">Latest Status Check:</h4>
              <ul>
                <li><strong>Status:</strong> ${latestCheck.status}</li>
                <li><strong>Response Time:</strong> ${latestCheck.response_time}ms</li>
                <li><strong>Checked At:</strong> ${new Date(latestCheck.checked_at).toLocaleString()}</li>
              </ul>
            ` : '<p style="color: #94a3b8;">No status checks found</p>'}

            <details style="margin-top: 20px;">
              <summary style="cursor: pointer; color: #60a5fa;">Show Raw JSON</summary>
              <pre>${JSON.stringify({ provider, incidents, latestCheck }, null, 2)}</pre>
            </details>
          </div>
        `;
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="test-result">
            <h3>❌ Error</h3>
            <p style="color: #ef4444;">${error.message}</p>
            <pre>${JSON.stringify(error, null, 2)}</pre>
          </div>
        `;
      }
    };

    // Load providers on page load
    loadProviders();
  </script>
</body>
</html>
